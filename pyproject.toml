[project]
name = "thesis-cv-diff"
version = "0.1.0"
description = "S4-based models for thesis"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "boto3>=1.38.35",
    "dotenv>=0.9.9",
    "dtaidistance>=2.3.13",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
    "numpy>=1.26.0,<2.0.0",
    "openpyxl>=3.1.5",
    "pandas>=2.3.0",
    "pywavelets>=1.8.0",
    "scikit-learn>=1.7.0",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "sympy>=1.11.1",
    "shap>=0.48.0",
    # S4 и окружение
    "einops",
    "cmake",
    "hydra-core",
    "omegaconf",
    "wandb",
    "pytorch-lightning==2.0.4",
    "transformers",
    "datasets",
    "sktime",
    "numba",
    "gluonts",
    "timm==0.5.4",
    "rich",
    "scipy",
    "lit", 
    # "torchtext",      
    "tslearn>=0.8.1",
    "fastdtw>=0.3.4",
]

# Индекс PyTorch с CUDA 12.1 (работает на этом драйвере)
[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
torchaudio = { index = "pytorch-cu121" }

[tool.uv]
override-dependencies = [
    "torch==2.1.2",
    "torchvision==0.16.2",
    "torchaudio==2.1.2",
]
